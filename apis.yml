aid: cerrion
name: Cerrion
description: 'Cerrion builds enterprise-grade video AI agents for manufacturing. Its
  platform connects to existing or provided factory cameras to monitor production lines
  in real time, using pre-trained visual triggers to automatically detect and respond
  to quality defects, safety hazards, process deviations, and equipment issues. The
  closed-loop system can slow or stop machines, raise alarms, and escalate alerts while
  giving operators root-cause insight, helping manufacturers resolve problems up to
  50% faster and cut downtime and scrap. Cerrion is deployed in live production across
  glass, food & beverage, tableware, sawmilling/timber, and CPG environments (customers
  include Unilever, Riedel, Schott Zwiesel, Stölzle Lausitz, Sisecam, and Verallia).
  Zurich-based and backed by Creandum, Y Combinator, Goat Capital, 10x Founders, and
  Session VC. No public developer API, SDKs, or documentation surface was found at the
  time of enrichment.'
